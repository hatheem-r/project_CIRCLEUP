<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CircleUp</title>
<style>
  :root {
    --bg: #0e1013;
    --panel: #15181e;
    --panel-lift: #1a1e25;
    --line: rgba(255, 255, 255, .07);
    --text: #e7e9ee;
    --muted: #8a8f9c;
    --faint: #5d626e;
    --good: #46c88a;
    --risky: #e3b341;
    --avoid: #ef6a5d;
    --accent: #7aa2f7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 72px 24px 120px;
  }

  /* ---------- header ---------- */

  header { margin-bottom: 56px; }

  h1 {
    margin: 0 0 10px;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -.02em;
  }

  .sub {
    margin: 0;
    color: var(--muted);
    font-size: 16px;
  }

  /* ---------- panels ---------- */

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px;
  }

  /* ---------- picking a file ---------- */

  .drop {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 36px 24px;
    border: 1px dashed rgba(255, 255, 255, .14);
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    transition: border-color .15s, background .15s;
  }

  .drop:hover, .drop.over {
    border-color: var(--accent);
    background: rgba(122, 162, 247, .05);
  }

  .drop-mark {
    width: 34px;
    height: 34px;
    margin-bottom: 6px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .16);
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
  }

  .drop-text { font-weight: 500; }
  .drop-hint { color: var(--faint); font-size: 13px; }

  .filename {
    margin: 18px 0 0;
    padding: 12px 14px;
    background: var(--panel-lift);
    border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 14px;
    display: flex;
    gap: 10px;
    align-items: baseline;
  }

  .field { display: block; margin-top: 18px; }

  .field span { display: block; margin-bottom: 7px; color: var(--muted); font-size: 13px; }

  .field input {
    width: 100%;
    padding: 12px 14px;
    background: var(--panel-lift);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 9px;
    font: inherit;
    font-size: 14px;
  }

  .field input:focus { outline: none; border-color: var(--accent); }
  .field input::placeholder { color: var(--faint); }

  .filename b { font-weight: 500; }
  .filename span { color: var(--faint); font-size: 13px; margin-left: auto; }

  button {
    margin-top: 20px;
    width: 100%;
    padding: 14px 20px;
    background: var(--text);
    color: #0e1013;
    border: 0;
    border-radius: 10px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }

  button:hover:not(:disabled) { opacity: .88; }

  button:disabled {
    background: var(--panel-lift);
    color: var(--faint);
    cursor: not-allowed;
  }

  /* ---------- progress ---------- */

  .steps { margin-top: 20px; }

  .step {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 9px 0;
    color: var(--faint);
    font-size: 14px;
  }

  .step .dot {
    flex: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1px solid currentColor;
  }

  .step.running { color: var(--text); }
  .step.running .dot {
    border-color: var(--accent);
    background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
  }

  .step.done { color: var(--muted); }
  .step.done .dot { border-color: var(--good); background: var(--good); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .35; transform: scale(.75); }
  }

  .step .note { color: var(--faint); font-size: 13px; }
  .step .elapsed { margin-left: auto; color: var(--faint); font-variant-numeric: tabular-nums; font-size: 13px; }

  /* ---------- error ---------- */

  .error {
    margin-top: 20px;
    padding: 16px 18px;
    background: rgba(239, 106, 93, .08);
    border: 1px solid rgba(239, 106, 93, .3);
    border-radius: 11px;
    color: #f3a19a;
    font-size: 14px;
  }

  .error b { display: block; margin-bottom: 4px; color: var(--avoid); font-weight: 600; }
  .error pre { margin: 6px 0 0; white-space: pre-wrap; font-size: 12.5px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ---------- results ---------- */

  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin-top: 44px;
  }

  @media (min-width: 860px) {
    .layout.split { grid-template-columns: 1.65fr 1fr; align-items: start; }
  }

  h2 {
    margin: 0 0 16px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--muted);
  }

  .tally { color: var(--faint); font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 8px; }

  .cards { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--edge, var(--line));
    border-radius: 12px;
    padding: 20px 22px;
  }

  .card.good { --edge: var(--good); }
  .card.risky { --edge: var(--risky); }
  .card.avoid { --edge: var(--avoid); }

  .card-top {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .when { font-weight: 600; font-size: 15px; }
  .hours { color: var(--faint); font-size: 13px; }

  .badge {
    margin-left: auto;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .badge.good { color: var(--good); background: rgba(70, 200, 138, .13); }
  .badge.risky { color: var(--risky); background: rgba(227, 179, 65, .13); }
  .badge.avoid { color: var(--avoid); background: rgba(239, 106, 93, .13); }

  .reason { margin: 0; color: var(--muted); font-size: 14.5px; }

  /* ---------- places ---------- */

  .places-btn {
    margin: 14px 0 0;
    width: auto;
    padding: 7px 14px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
  }

  .places-btn:hover:not(:disabled) { background: var(--panel-lift); color: var(--text); opacity: 1; }
  .places-btn:disabled { background: transparent; color: var(--faint); }

  .picks { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 4px; }

  .pick {
    display: flex;
    gap: 12px;
    align-items: baseline;
    padding: 12px 0 0;
  }

  .pick-n {
    flex: none;
    width: 18px;
    color: var(--faint);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .pick-body { min-width: 0; }

  .pick-head { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; }
  .pick-name { font-weight: 500; font-size: 14px; }
  .pick-rating { color: var(--risky); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  .pick-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 12.5px;
    border-bottom: 1px solid rgba(122, 162, 247, .3);
  }

  .pick-link:hover { border-bottom-color: var(--accent); }
  .pick-why { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }
  .pick-address { margin: 2px 0 0; color: var(--faint); font-size: 12px; }

  .places-note { margin: 12px 0 0; font-size: 13px; color: var(--faint); }
  .places-note.bad { color: #f3a19a; }

  /* ---------- deadlines ---------- */

  .side { padding: 24px; }

  .deadline {
    padding: 14px 0;
    border-top: 1px solid var(--line);
    font-size: 14px;
  }

  .deadline:first-of-type { border-top: 0; padding-top: 0; }
  .deadline-name { font-weight: 500; }

  .deadline-meta {
    margin-top: 3px;
    color: var(--faint);
    font-size: 12.5px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .course {
    color: var(--accent);
    background: rgba(122, 162, 247, .1);
    padding: 1px 7px;
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: 500;
  }

  .empty { color: var(--faint); font-size: 14px; margin: 0; }
</style>
</head>

<body>
<main>
  <header>
    <h1>CircleUp</h1>
    <p class="sub">Upload your timetable and find out when you are actually free.</p>
  </header>

  <section class="panel">
    <label class="drop" id="drop" for="file">
      <span class="drop-mark">+</span>
      <span class="drop-text">Choose a timetable image</span>
      <span class="drop-hint">PNG, JPG or PDF &middot; or drop one here</span>
      <input type="file" id="file" accept="image/*,application/pdf" hidden>
    </label>

    <p class="filename" id="filename" hidden></p>

    <label class="field" for="location">
      <span>Where are you looking for places?</span>
      <input type="text" id="location" placeholder="cafes in Colombo 7" autocomplete="off">
    </label>

    <button id="go" disabled>Find my free time</button>
  </section>

  <section class="panel steps" id="progress" hidden aria-live="polite"></section>
  <div class="error" id="error" hidden></div>

  <div class="layout" id="layout">
    <section id="results"></section>
    <aside class="panel side" id="deadlines" hidden></aside>
  </div>
</main>

<script>
const TZ = "Asia/Colombo";          // the API answers in Colombo time; show it as sent
const VERDICTS = ["good", "risky", "avoid"];

// the places proxy runs on its own; swap this for the Render URL once deployed
const PLACES_SERVICE = "http://localhost:8001";

const el = (id) => document.getElementById(id);
const fileInput = el("file"), drop = el("drop"), go = el("go");

// ---------- picking a file ----------

let picked = null;

function choose(file) {
  picked = file || null;
  if (!picked) { el("filename").hidden = true; go.disabled = true; return; }

  el("filename").hidden = false;
  el("filename").innerHTML = `<b></b><span></span>`;
  el("filename").querySelector("b").textContent = picked.name;
  el("filename").querySelector("span").textContent = `${Math.round(picked.size / 1024)} KB`;
  go.disabled = false;
}

fileInput.addEventListener("change", () => choose(fileInput.files[0]));

const location_ = el("location");
try { location_.value = localStorage.getItem("circleup.location") || ""; } catch { /* private mode */ }
location_.addEventListener("change", () => {
  try { localStorage.setItem("circleup.location", location_.value.trim()); } catch { /* ignore */ }
});

["dragenter", "dragover"].forEach((e) =>
  drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((e) =>
  drop.addEventListener(e, () => drop.classList.remove("over")));

drop.addEventListener("drop", (ev) => {
  ev.preventDefault();
  const file = ev.dataTransfer.files[0];
  if (file) { fileInput.files = ev.dataTransfer.files; choose(file); }
});

// ---------- progress ----------

const STEPS = [
  ["parse", "Reading your timetable", "a vision model looks at the image — this is the slow one"],
  ["windows", "Working out your free windows", ""],
  ["deadlines", "Checking your Moodle deadlines", ""],
  ["suggest", "Weighing up each window", "one model call per window"],
];

let timer = null, startedAt = 0, current = -1;

function drawSteps() {
  el("progress").innerHTML = "";
  STEPS.forEach(([key, label, note], i) => {
    const state = i < current ? "done" : i === current ? "running" : "";
    const row = document.createElement("div");
    row.className = `step ${state}`;
    row.innerHTML = `<span class="dot"></span><span class="label"></span>`;
    row.querySelector(".label").textContent = label;
    if (note && i === current) {
      const n = document.createElement("span");
      n.className = "note";
      n.textContent = note;
      row.appendChild(n);
    }
    if (i === current) {
      const t = document.createElement("span");
      t.className = "elapsed";
      t.id = "elapsed";
      row.appendChild(t);
    }
    el("progress").appendChild(row);
  });
}

function step(i) {
  current = i;
  startedAt = Date.now();
  drawSteps();
}

function startClock() {
  timer = setInterval(() => {
    const t = el("elapsed");
    if (t) t.textContent = `${Math.round((Date.now() - startedAt) / 1000)}s`;
  }, 250);
}

function stopClock() {
  clearInterval(timer);
  timer = null;
}

// ---------- formatting ----------

const dayOf = (iso) => new Date(iso).toLocaleDateString("en-GB",
  { weekday: "long", day: "numeric", month: "short", timeZone: TZ });

const clockOf = (iso) => new Date(iso).toLocaleTimeString("en-GB",
  { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: TZ });

function spanOf(start, end) {
  const mins = Math.round((new Date(end) - new Date(start)) / 60000);
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? `${h}h ${m}m free` : `${h}h free`;
}

function dueOf(d) {
  const day = dayOf(d.due_at);
  return d.all_day ? `by end of ${day}` : `${day}, ${clockOf(d.due_at)}`;
}

function awayOf(iso) {
  const days = Math.round((new Date(iso) - Date.now()) / 86400000);
  if (days <= 0) return "today";
  return days === 1 ? "tomorrow" : `in ${days} days`;
}

// ---------- rendering ----------

function showResults(suggestions) {
  const tally = VERDICTS
    .map((v) => [v, suggestions.filter((s) => s.verdict === v).length])
    .filter(([, n]) => n)
    .map(([v, n]) => `${n} ${v}`)
    .join(" · ");

  const head = document.createElement("h2");
  head.textContent = "Your free windows";
  const count = document.createElement("span");
  count.className = "tally";
  count.textContent = tally;
  head.appendChild(count);

  const list = document.createElement("div");
  list.className = "cards";

  for (const s of suggestions) {
    const card = document.createElement("article");
    card.className = `card ${s.verdict}`;
    card.innerHTML = `
      <div class="card-top">
        <span class="when"></span>
        <span class="hours"></span>
        <span class="badge ${s.verdict}"></span>
      </div>
      <p class="reason"></p>`;
    card.querySelector(".when").textContent = `${dayOf(s.start)}, ${clockOf(s.start)}–${clockOf(s.end)}`;
    card.querySelector(".hours").textContent = spanOf(s.start, s.end);
    card.querySelector(".badge").textContent = s.verdict;
    card.querySelector(".reason").textContent = s.reason;

    // nowhere is worth going when the verdict is avoid
    if (s.verdict !== "avoid") {
      const button = document.createElement("button");
      button.className = "places-btn";
      button.textContent = "Find places";
      button.addEventListener("click", () => findPlaces(card, s, button));

      const note = document.createElement("p");
      note.className = "places-note";
      note.hidden = true;

      card.append(button, note);
    }

    list.appendChild(card);
  }

  const out = el("results");
  out.innerHTML = "";
  out.append(head, list);
}

async function findPlaces(card, suggestion, button) {
  const where = el("location").value.trim();
  const note = card.querySelector(".places-note");

  if (!where) {
    note.hidden = false;
    note.className = "places-note bad";
    note.textContent = "Fill in where you are looking first.";
    el("location").focus();
    return;
  }

  button.disabled = true;
  note.hidden = false;
  note.className = "places-note";
  note.textContent = "Looking for places\u2026";
  card.querySelector(".picks")?.remove();

  try {
    const url = new URL("/places", PLACES_SERVICE);
    url.searchParams.set("location", where);
    url.searchParams.set("start", suggestion.start);
    url.searchParams.set("end", suggestion.end);

    const { places } = await call(url.toString());
    if (!places.length) {
      note.textContent = `Nothing came back for \u201c${where}\u201d.`;
      return;
    }

    note.textContent = `Ranking ${places.length} places\u2026`;
    const { picks } = await call("/suggest-places", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        day: dayOf(suggestion.start),
        start: suggestion.start,
        end: suggestion.end,
        verdict: suggestion.verdict,
        places,
      }),
    });

    if (!picks.length) {
      // invalid picks are dropped rather than retried, so none may survive
      note.textContent = "The model did not pick any of those places. Try again.";
      return;
    }

    note.hidden = true;
    card.appendChild(renderPicks(picks));
    button.textContent = "Find other places";
  } catch (err) {
    note.className = "places-note bad";
    note.textContent = err.message;
  } finally {
    button.disabled = false;
  }
}

function renderPicks(picks) {
  const box = document.createElement("div");
  box.className = "picks";

  picks.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "pick";
    row.innerHTML = `
      <span class="pick-n"></span>
      <div class="pick-body">
        <div class="pick-head">
          <span class="pick-name"></span>
          <span class="pick-rating"></span>
          <a class="pick-link" target="_blank" rel="noopener noreferrer">Open in Maps</a>
        </div>
        <p class="pick-why"></p>
        <p class="pick-address"></p>
      </div>`;

    row.querySelector(".pick-n").textContent = `${i + 1}.`;
    row.querySelector(".pick-name").textContent = p.name;
    row.querySelector(".pick-rating").textContent = p.rating == null ? "" : `\u2605 ${p.rating}`;
    row.querySelector(".pick-link").href = p.maps_url;
    row.querySelector(".pick-why").textContent = p.why;

    const addr = row.querySelector(".pick-address");
    if (p.address) addr.textContent = p.address;
    else addr.remove();

    box.appendChild(row);
  });

  return box;
}

function showDeadlines(deadlines) {
  const side = el("deadlines");
  side.hidden = false;
  side.innerHTML = "";

  const head = document.createElement("h2");
  head.textContent = "Deadlines considered";
  const count = document.createElement("span");
  count.className = "tally";
  count.textContent = `next 14 days`;
  head.appendChild(count);
  side.appendChild(head);

  if (!deadlines.length) {
    const none = document.createElement("p");
    none.className = "empty";
    none.textContent = "Nothing due in the next 14 days.";
    side.appendChild(none);
    return;
  }

  for (const d of deadlines) {
    const row = document.createElement("div");
    row.className = "deadline";
    row.innerHTML = `<div class="deadline-name"></div><div class="deadline-meta"></div>`;
    row.querySelector(".deadline-name").textContent = d.name;

    const meta = row.querySelector(".deadline-meta");
    if (d.course) {
      const c = document.createElement("span");
      c.className = "course";
      c.textContent = d.course;
      meta.appendChild(c);
    }
    const when = document.createElement("span");
    when.textContent = `${dueOf(d)} · ${awayOf(d.urgency_at)}`;
    meta.appendChild(when);

    side.appendChild(row);
  }
}

function showError(heading, detail) {
  const box = el("error");
  box.hidden = false;
  box.innerHTML = `<b></b><span></span>`;
  box.querySelector("b").textContent = heading;
  if (detail) {
    const pre = document.createElement("pre");
    pre.textContent = detail;
    box.appendChild(pre);
  }
}

// ---------- the run ----------

async function call(path, options) {
  const res = await fetch(path, options);
  let body = null;
  try { body = await res.json(); } catch { /* no JSON to read */ }

  if (!res.ok) {
    const detail = body && body.detail ? body.detail : `${res.status} ${res.statusText}`;
    const err = new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
    err.path = path;
    throw err;
  }
  return body;
}

go.addEventListener("click", async () => {
  if (!picked) return;

  go.disabled = true;
  go.textContent = "Working…";
  el("error").hidden = true;
  el("results").innerHTML = "";
  el("deadlines").hidden = true;
  el("layout").classList.remove("split");
  el("progress").hidden = false;
  startClock();

  try {
    const form = new FormData();
    form.append("file", picked);

    step(0);
    await call("/parse", { method: "POST", body: form });

    step(1);
    const { windows } = await call("/windows");

    step(2);
    const { deadlines } = await call("/deadlines");

    step(3);
    const { suggestions } = await call("/suggest", { method: "POST" });

    current = STEPS.length;
    stopClock();
    drawSteps();
    el("progress").hidden = true;

    if (!windows.length) {
      showError("No free windows", "Nothing of 2 hours or more came back for the next 7 days.");
    } else {
      showResults(suggestions);
    }
    showDeadlines(deadlines);
    el("layout").classList.add("split");
  } catch (err) {
    stopClock();
    el("progress").hidden = true;
    showError(`That didn't work${err.path ? ` (${err.path})` : ""}`, err.message);
  } finally {
    go.disabled = false;
    go.textContent = "Find my free time";
  }
});
</script>
</body>
</html>
